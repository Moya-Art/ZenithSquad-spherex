# Every runtime setting the API needs on Cloud Run. Deployed with --env-vars-file because the CORS
# value is a comma-separated list of URLs, which --set-env-vars cannot express (gcloud splits the
# value on commas and each piece is then parsed as its own KEY=VALUE).
CORS_ORIGINS: "https://www.zenithsquad.earth,https://zenithsquad.earth,https://zenith-squad-spherex.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
API_CACHE_DIR: /tmp/api-cache
FITS_CACHE_DIR: /tmp/fits-cache
TILE_CACHE_DIR: /tmp/cube_tiles
LOG_LEVEL: INFO
